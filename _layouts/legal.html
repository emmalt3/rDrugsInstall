<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta
			http-equiv="Content-Security-Policy"
			content="
      default-src 'none';
      style-src   'self' 'unsafe-inline';
      form-action 'none';
      base-uri    'self';
      frame-ancestors 'none';
    "
		/>
		<title>{{ page.title }} · r/Drugs Utilities</title>
		<meta
			name="description"
			content="{{ page.title }} for the r/Drugs Utilities bot."
		/>
		<meta name="robots" content="noindex, nofollow" />
		<style>
			:root {
				--bg: #111013;
				--surface: #1a1720;
				--border: #2a2530;
				--accent: #c084fc;
				--accent-alt: #e879a0;
				--text: #e2dce8;
				--text-sub: #8b8096;
				--text-muted: #4a4355;
				--error: #f87171;
				--radius: 10px;
				--radius-sm: 6px;
			}

			*,
			*::before,
			*::after {
				box-sizing: border-box;
				margin: 0;
				padding: 0;
			}

			body {
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
				background: var(--bg);
				color: var(--text);
				min-height: 100vh;
				padding: 2.5rem 1rem 3rem;
			}

			/* ── layout ── */
			.page {
				width: 100%;
				max-width: 760px;
				margin: 0 auto;
				display: flex;
				flex-direction: column;
				gap: 1.5rem;
			}

			.top-nav {
				display: flex;
			}

			.back-link {
				font-size: 0.85rem;
				color: var(--text-muted);
				text-decoration: none;
				transition: color 0.15s ease;
			}

			.back-link:hover {
				color: var(--text-sub);
				text-decoration: underline;
			}

			.back-link:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 3px;
				border-radius: 2px;
			}

			/* ── legal card ── */
			.legal-card {
				background: var(--surface);
				border: 1px solid var(--border);
				border-radius: var(--radius);
				padding: 2.5rem 2rem;
			}

			@media (min-width: 640px) {
				.legal-card {
					padding: 3rem 3.5rem;
				}
			}

			/* ── article typography ── */
			article h1 {
				font-size: 1.5rem;
				font-weight: 700;
				color: var(--text);
				letter-spacing: -0.2px;
				padding-bottom: 1.25rem;
				margin-bottom: 1.5rem;
				border-bottom: 1px solid var(--border);
			}

			@media (min-width: 640px) {
				article h1 {
					font-size: 1.75rem;
				}
			}

			article h2 {
				font-size: 1.1rem;
				font-weight: 700;
				color: var(--text);
				letter-spacing: -0.1px;
				margin-top: 2.25rem;
				margin-bottom: 0.85rem;
			}

			article h2:first-child {
				margin-top: 0;
			}

			article h3 {
				font-size: 0.95rem;
				font-weight: 600;
				color: var(--text-sub);
				text-transform: uppercase;
				letter-spacing: 0.04em;
				margin-top: 1.5rem;
				margin-bottom: 0.6rem;
			}

			article p {
				font-size: 0.95rem;
				line-height: 1.75;
				color: var(--text-sub);
				margin-bottom: 1rem;
			}

			article strong {
				color: var(--text);
				font-weight: 600;
			}

			article em {
				color: var(--text-sub);
				font-style: italic;
			}

			article ul,
			article ol {
				margin: 0 0 1.1rem 0;
				padding-left: 1.35rem;
				color: var(--text-sub);
			}

			article li {
				font-size: 0.95rem;
				line-height: 1.7;
				margin-bottom: 0.55rem;
			}

			article li::marker {
				color: var(--text-muted);
			}

			article li > ul,
			article li > ol {
				margin-top: 0.55rem;
				margin-bottom: 0;
			}

			article a {
				color: var(--accent);
				text-decoration: underline;
				text-underline-offset: 2px;
			}

			article a:hover {
				color: var(--accent-alt);
			}

			article a:focus-visible {
				outline: 2px solid var(--accent);
				outline-offset: 2px;
				border-radius: 2px;
			}

			article hr {
				border: none;
				border-top: 1px solid var(--border);
				margin: 2rem 0;
			}

			article code {
				background: var(--bg);
				border: 1px solid var(--border);
				border-radius: 4px;
				padding: 0.1rem 0.35rem;
				font-size: 0.85em;
			}

			article > *:last-child {
				margin-bottom: 0;
			}

			/* ── footer ── */
			.page-footer {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 0.75rem;
				text-align: center;
			}

			.footer-copy {
				font-size: 0.72rem;
				color: var(--text-muted);
			}
		</style>
	</head>
	<body>
		<div class="page">
			<nav class="top-nav" aria-label="Breadcrumb">
				<a class="back-link" href="/rDrugsInstall/"
					>&larr; Back to home</a
				>
			</nav>
			<main class="legal-card">
				<article>
					{{ content }}
				</article>
			</main>
			<footer class="page-footer">
				<a class="back-link" href="/rDrugsInstall/"
					>&larr; Back to home</a
				>
				<p class="footer-copy">
					&copy; {{ site.time | date: "%Y" }} r/Drugs Official. All
					rights reserved.
				</p>
			</footer>
		</div>
	</body>
</html>
